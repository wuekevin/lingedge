conventions:   # LingEdge 约定（以键值保存，重新生成时不会丢失）
  waiting_env_verification: "「等待环境验证」映射（ADR-023 §C、基线 §25）：技能状态枚举没有该状态，故约定——开发与本机可执行的测试全部完成、但仍缺所需真实环境的
    Story，development_status 停在 review，不得写成 done；其缺口、已完成的测试层与待执行步骤登记在 environment_verification（验证人/日期留空待填），全部条件满足并填写后才允许改为
    done。"
  ready_for_dev: "ready-for-dev 的含义：epics.md 中的 Story 条目即规格（Epic 1 的 45 个 Story 均为单会话/验收，不另建
    story 文件）；仅把全部前置依赖已满足且环境具备的 Story 标 ready-for-dev，其余按单线顺序在前一个 done 后推进（吸收前序经验）。"
  extension_keys: "以下顶层键为 LingEdge 扩展（conventions、readiness_gate、sprint_plan、environment_verification、sprint_prerequisites），sprint_plan.py
    作为未知键原样保留。"

