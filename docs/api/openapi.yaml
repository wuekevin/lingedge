              $ref: '#/components/schemas/PublishQueueItem'
        required:
        - items
    DeploymentCreate:
      type: object
      description: 发布站点当前工作态（租户视图）：进入所属集群的发布编排队列（同集群串行，ADR-002 §D-PUB）→ 以集群『最近全量确认修订』为基线 copy-forward 仅替换本站点块 → 校验 → 签名 → 按平台灰度策略下发。租户不能指定集群、节点或灰度策略（NFR-14、ADR-009 §5）；灰度/批次/失败策略由平台在集群设置 rollout 中决定。
      properties:
        config_version:
          type: integer
          format: int64
          description: 必填：发布前置条件（『所见即所发』）。须等于当前 Site.config_version，否则 412 resource.precondition_failed。
        change_note:
          type: string
          maxLength: 512
      required:
      - config_version
    PendingChanges:
      type: object
