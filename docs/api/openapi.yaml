          type: array
          items:
            type: string
        required: true
        style: form
        explode: false
        description: 逗号分隔：requests,bytes_out,status_2xx,cache_hit,…
      - name: granularity
        in: query
        schema:
          type: string
          enum:
          - 1m
          - 5m
          - 1h
          - 1d
        required: true
      - name: from
        in: query
        schema:
          $ref: '#/components/schemas/Timestamp'
        required: true
      - name: to
        in: query
        schema:
          $ref: '#/components/schemas/Timestamp'
        required: true
