# LingEdge REST API — OpenAPI 3.1 草案（由架构代理生成；此后以本文件为事实源，手工维护）
# 权威：docs/prd/LINGEDGE_V2_REQUIREMENTS.md > PRD > 本文件。约定见 info.description 与 docs/api/README.md。
openapi: 3.1.0
info:
  title: LingEdge（凌界云）REST API
  version: 0.1.0-draft
  summary: LingEdge Server 的 /api/v1 接口草案
  description: |
    # LingEdge（凌界云）REST API — OpenAPI 3.1 草案

    > 状态：**draft**。权威顺序：需求基线 > PRD > 本文件。契约一经架构阶段冻结并打标签（PRD D-11），CI 对本文件与 `proto/` 做**破坏性变更检测**，变更须走 ADR。
    > 范围：M1（PRD 的 MVP）接口写详细（请求/响应/错误/分页/Task）；P2–P6 接口只写路径、摘要、`x-phase` 与主要 schema 名，字段以 `docs/database/*.md` 为准，阶段到来前须补全并重新冻结。**未交付阶段的接口不得被前端渲染、不得宣称可用（NFR-1/2）。**

    ## 通用约定（与 `docs/architecture/architecture.md` §9 一致）
    - **前缀** `/api/v1`；JSON（UTF-8）。时间为 RFC 3339 UTC（毫秒）；金额为 `{amount_minor, currency}` 整数最小货币单位；资源标识一律为 ULID `uid`。
    - **Request ID**：请求可带 `X-Request-ID`，缺失由服务端生成；**每个响应都返回该头**，并写入日志、审计与 Task。
    - **认证**：Admin / Console 各自独立的 Cookie 会话（`le_admin_sid` / `le_console_sid`；两个 realm 互不通用），写操作须带 `X-CSRF-Token`；机器调用使用 `Authorization: Bearer le_<prefix>_<secret>`（API Token）。Node/DNS/Reporter 不使用本 REST API，而用 gRPC + mTLS（见 `docs/api/node-protocol.md`）。
    - **租户上下文**：Console 主体 = 其所属租户；平台管理员（Admin）代租户操作时**必须**带 `X-Tenant-ID: <tenant uid>`，审计同时记录操作者与目标租户。`x-tenant-scope`：`platform`=仅平台主体、`tenant`=需要租户上下文、`either`=见下、`public`=无认证。**跨租户访问一律 `404 resource.not_found`**，不泄漏存在性（ADR-009）。
    - **`either` 与代租户的授权语义（ADR-018 §10）**：租户主体 → 限定在自己租户；平台主体**不带** `X-Tenant-ID` → 跨租户只读，须具备 operation 的 `x-permissions`；平台主体**带** `X-Tenant-ID` → 视为代租户（acting-as），须**同时**具备 `tenant:impersonate` 与 operation 的 `x-permissions`（这些权限的 scope 须为 `tenant` 或 `both`）。`x-tenant-scope: tenant` 的 operation 平台主体只能经 acting-as 调用。
    - **租户响应脱敏规则 R-T1（NFR-14、ADR-009 §5）**：`x-tenant-scope` 为 `tenant`/`either` 的请求与响应 schema **不得含 node/cluster 的内部标识**（属性名 `node_*`、`cluster_uid/name/id`、`egress_node*`、`targets`(节点列表) 等，以及节点主机名/IP/内部错误全文）；聚合计数（如 `summary.healthy/total/offline`）允许。灰度策略、批次、集群放置仅平台可见/可设。CI 对本文件做静态递归检查（跟随 $ref），隔离测试再对真实响应断言。
    - **再认证（L4 step-up，IMP-12）**：声明 `x-reauth: true` 的 operation（改运行模式、改角色/权限、创建/提权管理员、重置口令、吊销节点证书、改 SSRF 白名单…）要求会话在 `auth.reauth_window_s`（默认 300 秒）内通过 `POST /auth/reauth`，否则 `403 auth.reauth_required`。
    - **功能开关（`x-feature`，Story 1.22）**：商业类 operation（`billing` 标签下全部、`register`、`listPublicPlans`、`createTenant`）声明 `x-feature: commercial`：运行模式为 `self_hosted` 时，已认证主体访问返回 `403 feature.disabled`（认证之后、授权之前；匿名者先得 401）。CI（`make openapi-check`）强制：商业类 operation 必须声明、未知取值被拒；运行时路由清单的 feature 必须与本文件一致。
    - **权限**：每个操作的 `x-permissions` 是权限串（`resource:action`）列表，调用者须**全部**具备；`x-audit=true` 的操作写 `audit_logs`；`x-phase` 为交付阶段。
    - **错误**：统一 `ErrorResponse`；校验失败统一用 `400 validation.failed`（不使用 422，唯一例外：同一 `Idempotency-Key` 复用于不同请求体返回 `422 idempotency.key_reuse`）；登录节流/锁定统一 `429 rate_limit.exceeded`（无 423）；配置发布前校验失败为 `400 config.validation_failed`；功能未启用（运行模式/阶段）为 `403 feature.disabled`；乐观并发冲突为 `412 resource.precondition_failed`；资源冲突为 `409 resource.conflict` 或模块码（如 `site.domain_conflict`）。
    - **分页**：列表 `?page=1&page_size=20&sort=-created_at`（page_size 默认 20、最大 200）→ `{items,page,page_size,total}`；大体量集合（审计、访问日志、事件、流水）用游标 `?cursor=&limit=` → `{items,next_cursor}`。
    - **异步 Task**：耗时操作（发布、缓存刷新、证书分发、节点升级、站点删除…）立即返回 `202` + `Task`，`Location: /api/v1/tasks/{uid}`；`Task.status ∈ pending|running|success|partial|failed|canceled`；任务类型为**白名单枚举**，不存在执行任意命令的任务类型（FR-35）。
    - **幂等**：创建类 `POST` 支持 `Idempotency-Key`（服务端保存 24 小时）。
    - **乐观并发**：站点设置/规则等可变资源携带 `version`（或 `config_version`），更新时以 `If-Match` 传入。
    - **不泄漏**：私钥、API Token 明文、TOTP 密钥只在创建时出现一次，之后任何响应都不回显；日志与审计中脱敏。

    ## 契约冻结与破坏性变更检测（D-11）
    1. 架构阶段末给本文件与 `proto/` 打标签 `contract-v0.x`。
    2. CI：`openapi-diff`/等效工具（实现时选型）比较 PR 与标签版本，**删除字段/收紧约束/改变语义视为破坏性**，需 ADR 与版本号变更；仅「增」（新字段、新路径、新枚举值）允许。
    3. 路由一致性：CI 检查每条注册路由在本文件中存在且声明 `x-permissions`、`x-tenant-scope`、`x-audit`（NFR-4、NFR-22）。
    4. 前端 API 类型由本文件生成，禁止手写重复类型（ADR-014）。

    ## 索引
    权限串与错误码索引见 `docs/api/README.md`（由本文件自动汇总）。
  x-contract-status: draft（未冻结）
  x-baseline: docs/prd/LINGEDGE_V2_REQUIREMENTS.md
servers:
- url: /api/v1
  description: 同源相对路径：Nginx 将 /api/ 反代到 lingedge-server 127.0.0.1:8080
tags:
- name: auth
  description: 认证与会话：登录、登出、TOTP、会话、API Token、/auth/me（权限集与能力清单）
- name: admin
  description: 管理员后台通用能力：用户、角色权限、系统设置、品牌、运行模式、SSRF 白名单、版本信息、登录日志、密钥元数据（system）。审计日志读取已移到 /audit-logs（租户 Console 也可用，不在 /admin/ 下）
- name: tenants
  description: 租户、成员与配额（M1 仅默认租户；多租户管理 P5）
- name: sites
  description: 站点聚合根：站点、域名、源站、缓存策略、规则、网络设置（真实 IP 传递）、TLS、发布与部署。租户视图不含任何集群/节点标识（R-T1）；站点放置（集群绑定）与灰度策略由平台决定
- name: nodes
  description: 边缘节点：注册令牌、维护、升级、事件、实际生效版本（平台级，租户不可达）
- name: clusters
  description: 集群、成员、配置修订（不可变）、部署与回滚（平台级）
- name: dns
  description: DNS 与智能调度（P3）；DNSSEC（P6）
- name: cache
  description: 缓存刷新/预热/失效任务、缓存统计与磁盘
- name: waf
  description: WAF/CC/Bot/IP 限制与安全事件（P4）
- name: certificates
  description: SSL 证书：上传（M1）、ACME（P2）、分发与部署记录
- name: l4
  description: 四层代理 TCP/UDP（P4）
- name: metrics
  description: 监控统计：工作台、rollup、访问日志、探测、报表
- name: billing
  description: 产品、套餐、订阅、订单、钱包、用量、账单、支付、代理商、工单（P5）
- name: tasks
  description: 异步 Task：列表、详情、取消
- name: public
  description: 无认证公开接口：安装向导（需 X-Setup-Token）、官网真实数据、公开 CMS 读取
- name: admin/cms
  description: 官网运营 CMS（P2）：对应 Admin「官网运营」15 个菜单
- name: notifications
  description: 通知渠道/模板/告警（P2）与站内消息（P5）
- name: plugins
  description: 插件体系与第三方服务凭据（P2/P5）
security:
- adminSession: []
- consoleSession: []
- apiToken: []
paths:
  /auth/login:
    post:
      tags:
      - auth
      operationId: login
      summary: 登录（口令）
      description: 按 realm 建立会话。失败有节流（Redis + 登录日志）：超限统一返回 429 rate_limit.exceeded（含 Retry-After），节流按 identifier 计数而不论账号是否存在，故不存在账号枚举预言机（ADR-018）。凭据无效（用户不存在、口令错误、realm 不符、账号停用）统一返回 401 auth.invalid_credentials，响应逐字节相同。启用 TOTP 的用户返回 status=totp_required 与 mfa_token。
      parameters:
      - $ref: '#/components/parameters/XRequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 成功
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
      x-permissions: []
      x-tenant-scope: public
      x-audit: true
      x-phase: M1
      x-public: true
  /auth/totp/verify:
    post:
      tags:
      - auth
      operationId: verifyTotp
      summary: 登录第二步：TOTP/恢复码验证
      description: 凭 POST /auth/login 返回的一次性 mfa_token（5 分钟、同一挑战至多 5 次验证码尝试）与 6 位 TOTP 或一次性恢复码建立会话。验证码错误、同一 time-step 内重放、恢复码已用均返回 401 auth.totp_invalid 并计入登录节流（超限 429）；mfa_token 无效/过期/已用/尝试超限返回 401 auth.unauthenticated（须重新登录第一步）。成功时同 login（Set-Cookie、csrf_token），会话记录 mfa_verified_at。
      parameters:
      - $ref: '#/components/parameters/XRequestID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpVerifyRequest'
      responses:
        '200':
          description: 成功
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      security: []
      x-permissions: []
      x-tenant-scope: public
      x-audit: true
      x-phase: M1
      x-public: true
  /auth/logout:
    post:
      tags:
      - auth
      operationId: logout
      summary: 登出（吊销当前会话）
      description: 需携带会话 Cookie；任一 realm 的会话均可。
      parameters:
      - $ref: '#/components/parameters/XRequestID'
      - $ref: '#/components/parameters/XTenantID'
      - $ref: '#/components/parameters/XCSRFToken'
      responses:
        '204':
          description: 成功，无响应体
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      x-permissions: []
      x-tenant-scope: either
      x-audit: true
      x-phase: M1
  /auth/me:
    get:
      tags:
      - auth
      operationId: getMe
      summary: 当前身份、权限集与能力清单
      description: 前端据此构造动态菜单：菜单可见=模块已交付(capabilities.modules) ∧ 有权限 ∧ 运行模式允许（FR-31）。
      parameters:
      - $ref: '#/components/parameters/XRequestID'
      - $ref: '#/components/parameters/XTenantID'
      responses:
        '200':
          description: 成功
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
      x-permissions: []
      x-tenant-scope: either
      x-audit: false
      x-phase: M1
  /auth/csrf:
    get:
      tags:
      - auth
      operationId: getCsrfToken
      summary: 获取/刷新 CSRF 令牌
      description: Cookie 会话的写请求须带 X-CSRF-Token；Bearer API Token 请求不需要。
      parameters:
      - $ref: '#/components/parameters/XRequestID'
      - $ref: '#/components/parameters/XTenantID'
      responses:
        '200':
          description: 成功
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                type: object
                properties:
                  csrf_token:
                    type: string
                required:
                - csrf_token
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
      x-permissions: []
      x-tenant-scope: either
      x-audit: false
      x-phase: M1
  /auth/password/change:
    post:
      tags:
      - auth
      operationId: changePassword
      summary: 修改自己的口令
      parameters:
      - $ref: '#/components/parameters/XRequestID'
      - $ref: '#/components/parameters/XTenantID'
      - $ref: '#/components/parameters/XCSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '204':
          description: 成功，无响应体
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      x-permissions: []
      x-tenant-scope: either
      x-audit: true
      x-phase: M1
  /auth/reauth:
    post:
      tags:
      - auth
      operationId: reauth
      summary: 再认证（L4 敏感操作的 step-up）
      description: '用口令重新验证当前会话；已启用 TOTP 的账号还须提交 totp_code。成功后写 sessions.reauth_at，窗口 auth.reauth_window_s（默认 300 秒 [ASSUMPTION]）内允许调用声明 x-reauth: true 的操作；窗口外调用这些操作返回 403 auth.reauth_required。失败计入登录节流。'
      parameters:
      - $ref: '#/components/parameters/XRequestID'
      - $ref: '#/components/parameters/XCSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReauthRequest'
      responses:
        '200':
          description: 成功
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReauthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      x-permissions: []
      x-tenant-scope: either
      x-audit: true
      x-phase: M1
  /auth/totp/setup:
    post:
      tags:
      - auth
      operationId: setupTotp
      summary: 开始启用 TOTP（生成密钥）
      description: 生成新的 TOTP 密钥并以「待确认」状态经信封加密存储（需 POST /auth/totp/enable 确认后才生效）；密钥与 otpauth URI 仅在本响应出现一次。已启用时 409 resource.conflict。仅 Cookie 会话可用。
      parameters:
      - $ref: '#/components/parameters/XRequestID'
      - $ref: '#/components/parameters/XTenantID'
      - $ref: '#/components/parameters/XCSRFToken'
      responses:
        '200':
          description: 成功
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpSetupResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      x-permissions: []
      x-tenant-scope: either
      x-audit: true
      x-phase: M1
  /auth/totp/enable:
    post:
      tags:
      - auth
      operationId: enableTotp
      summary: 确认并启用 TOTP
      description: 用首次验证码确认并启用；一次性发放 10 个恢复码（明文仅此一次，库内只存哈希，单次有效）。验证码错误 401 auth.totp_invalid 并计入节流；已启用或未先 setup 时 409 resource.conflict。
      parameters:
      - $ref: '#/components/parameters/XRequestID'
      - $ref: '#/components/parameters/XTenantID'
      - $ref: '#/components/parameters/XCSRFToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TotpEnableRequest'
      responses:
        '200':
          description: 成功
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestID'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TotpEnableResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
      x-permissions: []
      x-tenant-scope: either
      x-audit: true
      x-phase: M1
  /auth/totp/disable:
    post:
      tags:
      - auth
      operationId: disableTotp
      summary: 停用 TOTP
      description: 需口令 + 当前验证码（TOTP 或恢复码）。若系统设置要求管理员必须启用 TOTP（login.totp_required_for_admin），平台用户不可停用（403 auth.forbidden）；未启用时 409 resource.conflict。
      parameters:
      - $ref: '#/components/parameters/XRequestID'
      - $ref: '#/components/parameters/XTenantID'
      - $ref: '#/components/parameters/XCSRFToken'
      requestBody:
        required: true
        content:
