    RulePhase:
      type: string
      enum:
      - access_control
      - waf_cc
      - redirect
      - rewrite
      - cache_rule
      - origin_rule
      - origin_headers
      - upstream_response
      - response_headers
      - respond
      description: 规则可挂载阶段。引擎固定阶段 real_ip / cache_lookup / cache_write 不接受规则；完整 13 阶段顺序见 ADR-005。 响应中只读，由 rule_type 派生（见 RuleType 的 x-rule-type-phases）；列表接口 phase 仅作过滤。
    RuleType:
      type: string
      enum:
      - redirect
      - url_rewrite
      - origin_rule
      - request_header
      - origin_request_header
      - response_header
      - cache_rule
      - access_control
      - page_rule
      - error_page
      - hotlink
      - rate_limit
      description: 统一规则类型（FR-63/64）。M1 可创建：redirect、url_rewrite、origin_rule、request_header、origin_request_header、response_header、cache_rule、access_control、error_page；page_rule=P2；hotlink/rate_limit=P4（未交付类型创建返回 400 validation.failed，错误 details 注明 feature 未启用）。 (rule_type → phase) 合法映射（只读派生，创建/校验请求不再接收 phase；ADR-005 §2）：redirect→redirect；url_rewrite、request_header→rewrite；cache_rule→cache_rule；origin_rule→origin_rule；origin_request_header→origin_headers；error_page→upstream_response（引擎拒绝时的自定义页面由 access_control 动作 deny{status,message_key} 表达）；response_header→response_headers；access_control、hotlink→access_control；rate_limit→waf_cc；page_rule→编译期展开（P2）。
      x-rule-type-phases:
        redirect: redirect
        url_rewrite: rewrite
        request_header: rewrite
        cache_rule: cache_rule
        origin_rule: origin_rule
        origin_request_header: origin_headers
        error_page: upstream_response
        response_header: response_headers
        access_control: access_control
        hotlink: access_control
        rate_limit: waf_cc
        page_rule: expanded
    ConditionLeaf:
      type: object
      properties:
        field:
          type: string
          enum:
          - host
          - path
          - uri
          - query
          - method
          - header
          - cookie
          - user_agent
          - referer
          - client_ip
          - cidr
          - asn
          - country
          - region
          description: 匹配字段。asn/country/region 依赖 GeoIP 数据源（D-15、OQ-5），P3/P4 启用，M1 校验时拒绝。
        name:
          type: string
          description: header/cookie/query 的键名（field 为 header、cookie、query 时必填）
        op:
          type: string
          enum:
          - eq
          - ne
          - contains
          - starts_with
          - ends_with
          - regex
          - in
          - not_in
          - exists
          - ip_in_cidr
          description: 操作符。regex 限定为 RE2 兼容子集（无回溯引用/环视），长度≤256；Server 另做指数歧义（EDA）检测并拒绝（rule.regex_ambiguous）；匹配前输入截断（path/uri ≤2048B、header ≤1024B、ua ≤512B）（F-6、ADR-005 §4）。
        value:
          description: 字符串、数字或数组（in/not_in）；exists 与 ip_in_cidr 的取值约定见 ADR-005
        on_limit:
          type: string
          enum:
          - fail_closed
          - no_match
          description: 仅 op=regex：匹配超限（lua_regex_match_limit）时的处置。fail_closed=拒绝该请求（access_control 规则默认）；no_match=视为不匹配（其它规则默认）。
      required:
      - field
      - op
    Condition:
      description: 条件树：leaf | {all:[...]} | {any:[...]} | {not:{...}}，支持 AND/OR/NOT 任意嵌套（深度与节点数上限由服务端校验）
      oneOf:
      - $ref: '#/components/schemas/ConditionLeaf'
      - type: object
        properties:
          all:
            type: array
            items:
              $ref: '#/components/schemas/Condition'
        required:
        - all
        additionalProperties: false
      - type: object
        properties:
          any:
            type: array
            items:
              $ref: '#/components/schemas/Condition'
        required:
        - any
        additionalProperties: false
      - type: object
        properties:
          not:
            $ref: '#/components/schemas/Condition'
        required:
        - not
        additionalProperties: false
    HeaderOp:
      type: object
      properties:
        op:
          type: string
          enum:
          - set
          - add
          - remove
        name:
          type: string
          pattern: "^[A-Za-z][A-Za-z0-9-]{0,63}$"
        value:
          type: string
          description: 可含白名单变量 ${host} ${path} ${path_suffix}(仅 redirect) ${query} ${uri} ${client_ip} ${scheme}；变量按编码形式输出（不含 CR/LF），插值后不得含控制字符；禁止其它插值。读取未入缓存键维度的变量（如 ${client_ip}）受缓存键封闭规则约束（ADR-005 §3.7）。
      required:
      - op
      - name
    RuleAction:
      description: 动作（恰好一个键，与 rule_type 对应）。动作参数是数据，不会成为 nginx 指令文本（ADR-004/005）。 request_headers/rewrite/origin/origin_request_headers/error_page 的外层可带 cache_interaction（缓存键封闭规则）。
      oneOf:
      - type: object
        properties:
          redirect:
            type: object
            properties:
              status:
                type: integer
                enum:
                - 301
                - 302
                - 307
                - 308
              location:
                type: string
                maxLength: 2048
                description: 目标模板：必须以单个 `/` 开头，或以字面量 `http(s)://<字面主机>/` 开头；变量只能出现在其后；插值结果不得以 `//`、`/\` 开头、不得含控制字符、长度≤4096（ADR-005 §1/§5）。可用变量 ${host} ${path} ${path_suffix} ${query} ${uri} ${client_ip} ${scheme}（编码形式输出）。
              preserve_query:
                type: boolean
              strip_prefix:
                type: string
                maxLength: 256
                description: 可选字面量前缀；设置后引擎自动追加 path starts_with 条件，且 ${path_suffix} = 规范化 path 去掉该前缀后的剩余（替代已删除的 scope.path_prefix）
            required:
            - status
            - location
        required:
        - redirect
        additionalProperties: false
      - type: object
        properties:
          rewrite:
            type: object
            properties:
              mode:
                type: string
                enum:
                - path
                - regex_path
                - query
              to:
                type: string
                maxLength: 2048
              from:
                type: string
            required:
            - mode
            - to
          cache_interaction:
            type: string
            enum:
            - key
            - bypass
            default: key
            description: key（默认）：规则读取的所有维度必须在生效缓存策略的键维度内，否则发布失败 rule.cache_key_dimension_conflict；bypass：规则命中的请求既不读也不写缓存（ngx.var.le_cache_bypass=1），允许规则依赖未入键维度。
        required:
        - rewrite
        additionalProperties: false
      - type: object
        properties:
          origin:
            type: object
            properties:
              origin_group_uid:
                $ref: '#/components/schemas/Uid'
              host_header:
                type: string
              path_prefix:
                type: string
          cache_interaction:
            type: string
            enum:
            - key
            - bypass
            default: key
            description: key（默认）：规则读取的所有维度必须在生效缓存策略的键维度内，否则发布失败 rule.cache_key_dimension_conflict；bypass：规则命中的请求既不读也不写缓存（ngx.var.le_cache_bypass=1），允许规则依赖未入键维度。
        required:
        - origin
        additionalProperties: false
      - type: object
        properties:
          request_headers:
            type: array
            items:
              $ref: '#/components/schemas/HeaderOp'
            description: 请求头修改（request_header 类型，客户端请求阶段 rewrite）
          cache_interaction:
            type: string
            enum:
            - key
            - bypass
            default: key
            description: key（默认）：规则读取的所有维度必须在生效缓存策略的键维度内，否则发布失败 rule.cache_key_dimension_conflict；bypass：规则命中的请求既不读也不写缓存（ngx.var.le_cache_bypass=1），允许规则依赖未入键维度。
        required:
        - request_headers
        additionalProperties: false
      - type: object
        properties:
          origin_request_headers:
            type: array
            items:
              $ref: '#/components/schemas/HeaderOp'
            description: 回源请求头（origin_request_header 类型，阶段 origin_headers）
          cache_interaction:
            type: string
            enum:
            - key
            - bypass
            default: key
            description: key（默认）：规则读取的所有维度必须在生效缓存策略的键维度内，否则发布失败 rule.cache_key_dimension_conflict；bypass：规则命中的请求既不读也不写缓存（ngx.var.le_cache_bypass=1），允许规则依赖未入键维度。
        required:
        - origin_request_headers
        additionalProperties: false
      - type: object
        properties:
          response_headers:
            type: array
            items:
              $ref: '#/components/schemas/HeaderOp'
            description: 响应头修改（阶段 response_headers）
        required:
        - response_headers
        additionalProperties: false
      - type: object
        properties:
          cache:
            type: object
            properties:
              mode:
                type: string
                enum:
                - bypass
                - override
                - respect_origin
                description: override 仅覆盖 TTL，不绕过 Set-Cookie/private/no-store/Authorization/Vary:* 保护；绕过只能经缓存策略的危险开关（需 risk_ack + 审计，FR-69）。
              ttl_s:
                type: integer
                format: int64
              status_ttls:
                type: object
                additionalProperties:
                  type: integer
                description: 状态码 → TTL
              cache_key:
                type: object
                properties:
                  query_policy:
                    type: string
                    enum:
                    - ignore_all
                    - include_all
                    - include_whitelist
                    - exclude_list
                  query_params:
                    type: array
                    items:
                      type: string
                  cookie_names:
                    type: array
                    items:
                      type: string
                  vary_headers:
                    type: array
                    items:
                      type: string
                description: 内联缓存键维度；存在时即为缓存键封闭规则（ADR-005 §3.7）的 keydims，否则取引用/默认缓存策略
              policy_uid:
                $ref: '#/components/schemas/Uid'
                description: 引用命名缓存策略
            required:
            - mode
        required:
        - cache
        additionalProperties: false
      - type: object
        properties:
          access:
            type: object
            properties:
              action:
                type: string
                enum:
                - allow
                - deny
              status:
                type: integer
                enum:
                - 401
                - 403
                - 404
                - 429
              message_key:
                type: string
            required:
            - action
        required:
        - access
        additionalProperties: false
      - type: object
        properties:
          error_page:
            type: object
            properties:
              status:
                type: integer
                minimum: 400
                maximum: 599
              body:
                type: string
                maxLength: 65536
                description: 静态 HTML（入库前净化，不允许脚本）
              content_type:
                type: string
                enum:
                - text/html
                - text/plain
                - application/json
            required:
            - status
            - body
          cache_interaction:
            type: string
            enum:
            - key
            - bypass
            default: key
            description: key（默认）：规则读取的所有维度必须在生效缓存策略的键维度内，否则发布失败 rule.cache_key_dimension_conflict；bypass：规则命中的请求既不读也不写缓存（ngx.var.le_cache_bypass=1），允许规则依赖未入键维度。
        required:
        - error_page
        additionalProperties: false
