      x-tenant-scope: public
      x-audit: false
      x-phase: P2
      x-public: true
components:
  securitySchemes:
    adminSession:
      type: apiKey
      in: cookie
      name: le_admin_sid
      description: Admin realm 会话 Cookie（HttpOnly、Secure、SameSite=Lax）；仅 user_type=platform 的用户可建立。写操作需 X-CSRF-Token。
    consoleSession:
      type: apiKey
      in: cookie
      name: le_console_sid
      description: Console realm 会话 Cookie（P5）；与 Admin 会话互不通用（FR-37）。
    apiToken:
      type: http
      scheme: bearer
      bearerFormat: le_<prefix>_<secret>
      description: API Token（作用域为权限串子集；吊销立即失效）。
  headers:
    XRequestID:
      description: 请求追踪 ID，与日志/审计/Task 中的 request_id 一致
      schema:
        type: string
  parameters:
    XRequestID:
      name: X-Request-ID
      in: header
      required: false
      description: 请求追踪 ID（ULID）。缺省由服务端生成；响应必返回同名头。
      schema:
        type: string
        maxLength: 64
    XTenantID:
      name: X-Tenant-ID
      in: header
      required: false
      description: 平台管理员（Admin）代租户操作时必填：目标租户 uid。Console 主体忽略/不得与自身租户冲突。
      schema:
        $ref: '#/components/schemas/Uid'
    XCSRFToken:
      name: X-CSRF-Token
      in: header
      required: false
      description: Cookie 会话的写请求必填（来自 /auth/me 或 /auth/csrf）；Bearer API Token 不需要。
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 创建类请求的幂等键（≤128 字符，服务端保存 24h）；同键同体返回首次结果，同键异体 422 idempotency.key_reuse。
      schema:
        type: string
        maxLength: 128
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: 乐观并发：资源的 version（ETag）。不匹配返回 412 resource.precondition_failed。
      schema:
        type: string
    XSetupToken:
      name: X-Setup-Token
      in: header
      required: true
      description: 安装向导一次性令牌（Tools 在终端显示，F-8）。仅在无 install.lock 时有效。
      schema:
        type: string
    Page:
      name: page
      in: query
      required: false
      description: 页码，从 1 起
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      required: false
      description: 每页条数（最大 200）
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 20
    Sort:
      name: sort
      in: query
      required: false
      description: 排序字段，前缀 - 表示降序，如 -created_at；可排序字段因资源而异
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      required: false
      description: 游标（上一页返回的 next_cursor）
      schema:
        type: string
    Limit:
      name: limit
      in: query
      required: false
      description: 本页条数（最大 200）
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    p_sessionId:
      name: sessionId
      in: path
      required: true
      description: 会话引用（不透明）
      schema:
        $ref: '#/components/schemas/Uid'
    p_tokenId:
      name: tokenId
      in: path
      required: true
      description: API Token uid
      schema:
        $ref: '#/components/schemas/Uid'
    p_userId:
      name: userId
      in: path
      required: true
      description: 用户 uid
      schema:
        $ref: '#/components/schemas/Uid'
    p_roleId:
      name: roleId
      in: path
      required: true
      description: 角色 uid
      schema:
        $ref: '#/components/schemas/Uid'
    p_auditId:
      name: auditId
      in: path
