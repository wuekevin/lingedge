        - items
    SiteRollbackRequest:
      type: object
      description: 站点级回滚到某站点版本：取该版本中本站点的块，进入发布队列后与集群最近全量确认修订的其余块组合生成新修订（rollback_of 指向旧修订），seq 仍单调（ADR-002）；同时生成新的站点版本（kind=rollback）。租户不指定集群。回滚前校验：引用的证书未被删除（已过期给警告）。
