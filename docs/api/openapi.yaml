      type: object
      description: 成功登录时服务端同时 Set-Cookie（le_admin_sid / le_console_sid，HttpOnly、Secure、SameSite=Lax）。
      properties:
        status:
          type: string
          enum:
          - ok
          - totp_required
          - must_change_password
          description: totp_required：已通过口令，须调用 /auth/totp/verify；must_change_password：登录成功但须先改密
        mfa_token:
          type: string
