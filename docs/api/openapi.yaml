        validation:
          $ref: '#/components/schemas/RuleValidateResult'
      required:
      - config_dirty
      - config_version
      - published_config_version
    SiteConfigVersion:
      type: object
      description: 站点线性版本（site_versions）。租户视图只含站点版本号，不含集群修订 seq/uid（集群修订见平台端点 /clusters/{clusterId}/revisions）。
