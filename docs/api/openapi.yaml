      operationId: publishSite
      summary: 发布站点（生成签名修订并灰度下发）
      description: 耗时操作：立即返回 202 + Task（type=deployment.publish）。流程：进入所属集群发布队列（同集群串行；同站点排队项合并）→ 出队时以集群最近全量确认修订为基线构建仅替换本站点块的新修订 → 汇编→校验→签名 → 按平台灰度策略下发 → 节点验签/nginx -t/应用/健康检查 → 确认（FR-55/56）。校验失败 400 config.validation_failed；config_version 与当前不符 412 resource.precondition_failed；站点尚未被平台绑定到任何集群 409 site.no_cluster_bound。租户不能指定集群、节点、灰度策略。
