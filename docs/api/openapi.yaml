    RealIpSettings:
      type: object
      description: 出站方向：LingEdge → 源站。访客伪造的同名 Header 一律被覆盖（FR-71）。
      properties:
        xff_enabled:
          type: boolean
          description: 向源站传 X-Forwarded-For
        xri_enabled:
          type: boolean
          description: 向源站传 X-Real-IP
        custom_enabled:
          type: boolean
          description: 是否传递自定义 Header
        custom_header:
          type:
          - string
          - 'null'
          pattern: "^[A-Za-z][A-Za-z0-9-]{0,63}$"
          description: 自定义 Header 名（如 Ling-Client-IP）。大小写不敏感保留名与保留前缀（Proxy-、Sec-、X-LingEdge-、Ling-Internal-）被拒绝，且不得与 X-Real-IP/X-Forwarded-For 重复（ADR-006、FR-72）。
        xff_policy:
          type: string
          enum:
          - overwrite
          - append_trusted
          description: overwrite=覆盖为已验证真实 IP；append_trusted=仅在可信链路上追加
        publish_state:
          $ref: '#/components/schemas/PublishState'
          description: 配置发布状态（只读，统一词表）
        published_header:
          type:
          - string
          - 'null'
          description: 当前线上实际生效的自定义 Header 名（只读）
      required:
      - xff_enabled
      - xri_enabled
      - custom_enabled
      - xff_policy
    RealIpSettingsUpdate:
      type: object
      properties:
        xff_enabled:
          type: boolean
        xri_enabled:
          type: boolean
        custom_enabled:
          type: boolean
        custom_header:
          type:
          - string
          - 'null'
        xff_policy:
          type: string
          enum:
          - overwrite
          - append_trusted
    TrustedProxies:
      type: object
      description: 入站可信代理（独立于出站真实 IP 传递）。站点级仅支持 X-Forwarded-For 链；PROXY protocol 入站是集群级 listen 设置，只能由平台在 Cluster.settings.node_global.proxy_protocol_inbound 配置（ADR-006）。判定在 Lua 引擎内完成（不使用 nginx realip 模块）。
      properties:
        inherit:
          type: boolean
          description: true=继承集群级可信代理；false=使用本站点 cidrs
        cidrs:
          type: array
          items:
            type: string
          description: 入站可信代理 CIDR；仅当 TCP 对端属于这些地址时才采信 X-Forwarded-For（FR-74）。拒绝（400 realip.trusted_proxy_forbidden，details[].reason ∈ prefix_too_short|loopback|multicast|reserved|self）：0.0.0.0/0、::/0、前缀短于 IPv4 /8 或 IPv6 /32、回环/多播/未指定/保留段、节点自身服务/出口地址；公网范围短于 /16 仅给警告（该范围内任何主机可伪造客户端 IP）。数量上限由服务端限制。
        effective_cidrs:
          type: array
          items:
            type: string
          description: 生效值（只读，含继承结果）
      required:
      - inherit
    RealIpDebugRequest:
      type: object
      description: 真实 IP 调试请求（FR-73）：服务端按站点所属集群选择一个在线节点，下发受限 debug_request 任务（节点经本机 ctl socket 调用与请求路径同一批纯函数模拟，不发起任何网络请求，不访问源站）。租户不能指定集群/节点。
      properties:
        method:
          type: string
          enum:
          - GET
          - HEAD
        path:
          type: string
          maxLength: 2048
          default: "/"
        simulate_headers:
          type: object
          additionalProperties:
            type: string
          maxProperties: 16
          description: '模拟访客伪造头（如 Ling-Client-IP: 6.6.6.6、X-Forwarded-For），用于验证覆盖行为'
        simulate_peer_ip:
          type: string
          description: 模拟连接来源 IP，仅作为纯函数入参（验证可信代理判定），不进入线上请求路径，不影响线上流量
