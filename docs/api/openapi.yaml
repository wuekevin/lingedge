          type: boolean
        config_version:
          type: integer
          format: int64
        published_config_version:
          type: integer
          format: int64
        changes:
          type: array
          items:
            type: object
            properties:
              resource_type:
                type: string
                enum:
                - site
                - domain
                - origin_group
                - origin
                - settings
                - rule
                - cache_policy
                - tls
              resource_uid:
                $ref: '#/components/schemas/Uid'
              change:
                type: string
                enum:
                - created
                - updated
                - deleted
              summary:
                type: string
              at:
                $ref: '#/components/schemas/Timestamp'
            required:
