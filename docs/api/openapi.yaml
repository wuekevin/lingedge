  responses:
    BadRequest:
      description: 请求参数/体校验失败（统一 400，不使用 422）
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: validation.failed
              message: 请求参数/体校验失败（统一 400，不使用 422）
              message_key: errors.validation.failed
              request_id: 01JCQ3Z8K6V9X4T2M7N5R1A0BC
    Unauthorized:
      description: 未认证或会话/令牌失效
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: auth.unauthenticated
              message: 未认证或会话/令牌失效
              message_key: errors.auth.unauthenticated
              request_id: 01JCQ3Z8K6V9X4T2M7N5R1A0BC
    Forbidden:
      description: 已认证但无权限，或功能未启用（feature.disabled）
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: auth.forbidden
              message: 已认证但无权限，或功能未启用（feature.disabled）
              message_key: errors.auth.forbidden
              request_id: 01JCQ3Z8K6V9X4T2M7N5R1A0BC
    ReauthRequired:
      description: 已登录但缺少权限（auth.forbidden），或该操作要求近期再认证而会话未在窗口内通过 POST /auth/reauth（auth.reauth_required）。
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: auth.reauth_required
              message: 该操作需要重新验证身份
              message_key: errors.auth.reauth_required
              request_id: 01JCQ3Z8K6V9X4T2M7N5R1A0BC
    NotFound:
      description: 资源不存在，或不属于当前租户（不泄漏存在性）
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: resource.not_found
              message: 资源不存在，或不属于当前租户（不泄漏存在性）
              message_key: errors.resource.not_found
              request_id: 01JCQ3Z8K6V9X4T2M7N5R1A0BC
    Gone:
      description: 安装向导接口在安装完成（install.lock 存在）后永久不可用（setup.already_installed）
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: setup.already_installed
              message: 系统已安装，安装向导不可用
              message_key: errors.setup.already_installed
              request_id: 01JCQ3Z8K6V9X4T2M7N5R1A0BC
    Conflict:
      description: 资源冲突（唯一性、状态不允许、被引用等）
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: resource.conflict
              message: 资源冲突（唯一性、状态不允许、被引用等）
              message_key: errors.resource.conflict
              request_id: 01JCQ3Z8K6V9X4T2M7N5R1A0BC
    PreconditionFailed:
      description: If-Match 版本不匹配
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: resource.precondition_failed
              message: If-Match 版本不匹配
              message_key: errors.resource.precondition_failed
              request_id: 01JCQ3Z8K6V9X4T2M7N5R1A0BC
    IdempotencyKeyReuse:
      description: 同一 Idempotency-Key 用于不同请求体
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: idempotency.key_reuse
              message: 同一 Idempotency-Key 用于不同请求体
              message_key: errors.idempotency.key_reuse
              request_id: 01JCQ3Z8K6V9X4T2M7N5R1A0BC
    TooManyRequests:
      description: 触发限流
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
        Retry-After:
          description: 建议重试等待秒数
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: rate_limit.exceeded
              message: 触发限流
              message_key: errors.rate_limit.exceeded
              request_id: 01JCQ3Z8K6V9X4T2M7N5R1A0BC
    InternalError:
      description: 服务端内部错误（不暴露内部细节，凭 request_id 排查）
      headers:
        X-Request-ID:
          $ref: '#/components/headers/XRequestID'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: internal.error
              message: 服务端内部错误（不暴露内部细节，凭 request_id 排查）
              message_key: errors.internal.error
              request_id: 01JCQ3Z8K6V9X4T2M7N5R1A0BC
  schemas:
    Uid:
      type: string
      pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
      minLength: 26
      maxLength: 26
      description: 资源对外标识：ULID（Crockford Base32，26 字符）。API 与 gRPC 一律使用 uid，不暴露内部自增 id。
      examples:
      - 01JCQ3Z8K6V9X4T2M7N5R1A0BC
    PublishState:
      type: string
      enum:
      - never_published
      - published
      - unpublished_changes
      description: 资源级发布状态（只读，全 API 统一）：never_published=从未发布；published=工作态与已发布一致；unpublished_changes=已保存，未发布（工作态与已发布不同）。部署过程状态由 deployment_status/SiteDeploymentView 表达。UX 词表映射见 docs/api/README.md §7。
    Timestamp:
      type: string
      format: date-time
      description: RFC 3339 UTC 时间，毫秒精度，例如 2026-11-16T12:00:00.000Z。
      examples:
      - '2026-11-16T12:00:00.000Z'
    Money:
      type: object
      description: 金额：整数最小货币单位 + 币种（architecture §9.1）。
      properties:
        amount_minor:
          type: integer
          format: int64
          description: 整数最小货币单位（如 CNY 的「分」）。禁止浮点。
        currency:
          type: string
          pattern: ^[A-Z]{3}$
          description: ISO 4217 货币代码
      required:
      - amount_minor
      - currency
    PageMeta:
      type: object
      description: 页码分页元数据（page 从 1 起，page_size 默认 20、最大 200）。
      properties:
        page:
          type: integer
          format: int32
        page_size:
          type: integer
          format: int32
        total:
          type: integer
          format: int64
      required:
      - page
      - page_size
      - total
    CursorMeta:
      type: object
      description: 游标分页元数据；next_cursor 为 null 表示已到末尾。
      properties:
        next_cursor:
          type:
          - string
          - 'null'
      required:
      - next_cursor
    ErrorDetail:
      type: object
      properties:
        field:
          type: string
          description: 出错字段路径，如 domains[0].hostname
        reason:
          type: string
          description: 人类可读原因
        code:
          type: string
          description: 字段级稳定码（可选）
      required:
      - reason
    Error:
      type: object
      description: 统一错误对象。
      properties:
        code:
          type: string
          description: 稳定的小写点分错误码，见 docs/api/README.md 错误码索引。通用码：auth.unauthenticated、auth.forbidden、validation.failed、resource.not_found、resource.conflict、resource.precondition_failed、rate_limit.exceeded、internal.error、feature.disabled、config.validation_failed、task.failed、idempotency.key_reuse。
          examples:
          - site.domain_conflict
        message:
          type: string
          description: 面向人的默认语言说明（不含敏感信息）
        message_key:
          type: string
          description: 前端 i18n 键，如 errors.site.domain_conflict
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
        request_id:
          type: string
          description: 与响应头 X-Request-ID 相同，用于追踪日志/审计/Task
      required:
      - code
      - message
      - request_id
    ErrorResponse:
      type: object
      description: 统一错误响应体：所有 4xx/5xx 均为此形态。跨租户访问一律 404 resource.not_found（不泄漏存在性）。
      properties:
        error:
          $ref: '#/components/schemas/Error'
      required:
      - error
    TaskStatus:
      type: string
      enum:
      - pending
      - running
      - success
      - partial
      - failed
      - canceled
      description: partial=扇出任务部分成功（如缓存刷新部分节点失败）。与 tasks.status 一致。
    TaskType:
      type: string
      enum:
      - deployment.publish
      - deployment.retry
      - publish.dispatch
      - cache.purge_url
      - cache.purge_site
      - cache.prefetch
      - cache.purge_prefix
      - cert.issue
      - cert.renew
      - cert.distribute
      - node.upgrade
      - node.rollback
      - realip.debug
      - system.backup
      - dns.sync
      - retention.cleanup
      - rollup.aggregate
      - usage.derive
      - heartbeat.sweep
      - secrets.rewrap
      - server.cert_rotate
      - media.cleanup_orphans
      - cms.revalidate
      - cms.publish_due
      - cms.prerender
      description: 任务类型是白名单枚举，**本枚举是唯一事实源**（architecture §9.2、ADR-019、platform-identity §4.1 不再另列清单）；不存在「执行任意命令」的任务类型（FR-35、NFR-14）。后续阶段会追加枚举值（expand）。
    Task:
      type: object
      description: 异步任务（tasks 表）。耗时操作返回 202 + Task。面向租户主体时 payload/result 不含集群/节点标识（R-T1）。
      properties:
        uid:
          $ref: '#/components/schemas/Uid'
        type:
          $ref: '#/components/schemas/TaskType'
        status:
          $ref: '#/components/schemas/TaskStatus'
        progress:
          type: integer
          format: int32
          description: 0–100
          minimum: 0
          maximum: 100
        tenant_uid:
          oneOf:
          - $ref: '#/components/schemas/Uid'
          - type: 'null'
        payload:
          type: object
          additionalProperties: true
          description: 入参摘要（不含敏感明文）
        result:
          type:
          - object
          - 'null'
          additionalProperties: true
        error:
          type:
          - object
          - 'null'
          properties:
            code:
              type: string
            message:
              type: string
          required:
          - code
          - message
        attempts:
          type: integer
          format: int32
        request_id:
          type: string
        parent_task_uid:
          oneOf:
          - $ref: '#/components/schemas/Uid'
          - type: 'null'
        created_by:
          oneOf:
          - $ref: '#/components/schemas/Uid'
          - type: 'null'
        created_at:
          $ref: '#/components/schemas/Timestamp'
        started_at:
          oneOf:
          - $ref: '#/components/schemas/Timestamp'
