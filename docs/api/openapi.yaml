    RuleValidationIssue:
      type: object
      properties:
        severity:
          type: string
          enum:
          - error
          - warning
        path:
          type: string
          description: JSON Pointer，如 /doc/action/redirect/location
        code:
          type: string
          enum:
          - rule.invalid
          - rule.regex_rejected
          - rule.regex_ambiguous
          - rule.type_unavailable
          - rule.cache_key_dimension_conflict
          - rule.interpolation_invalid
          - rule.redirect_target_invalid
          - rule.loop_detected
          - realip.header_invalid
          - realip.header_reserved
          - origin.address_blocked
          description: 稳定问题码。rule.cache_key_dimension_conflict=缓存键封闭规则被违反：规则读取了未入缓存键的维度（Cookie/UA/Header/Query/client_ip…）却参与回源/改写/回源头，会造成跨用户缓存泄漏（FR-69、ADR-005 §3.7）；处置：把该维度纳入缓存策略键，或在规则动作声明 cache_interaction=bypass。
        message:
