        no-test-infra-in-production:
          list-mode: lax
          files:
            - "!$test"
            - "!${base-path}/tests/**"
            - "!**/testdouble/**"
          deny:
            - pkg: "testing"
              desc: "非测试代码不得 import testing（ADR-023 §A.6）；测试替身只允许位于 _test.go、tests/、internal/**/testdouble/"
            - pkg: "net/http/httptest"
              desc: "非测试代码不得 import net/http/httptest（NFR-1）"
            - pkg: "github.com/stretchr/testify"
              desc: "非测试代码不得 import 测试库 testify（NFR-1）"
            - pkg: "go.uber.org/mock"
              desc: "非测试代码不得 import 测试替身库 gomock（NFR-1）"
            - pkg: "github.com/DATA-DOG/go-sqlmock"
              desc: "非测试代码不得 import sqlmock（NFR-1）"
            - pkg: "github.com/alicebob/miniredis"
              desc: "非测试代码不得 import miniredis（NFR-1；Redis 相关验证用真实实例）"
