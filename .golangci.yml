    forbidigo:
      analyze-types: true
      forbid:
        - pattern: "^exec\\.(Command|CommandContext|Cmd)$"
          msg: "禁止直接使用 os/exec（G-12/NFR-9）：外部程序只能经 internal/tools/security 的白名单入口以参数数组调用"
        - pattern: "^syscall\\.(Exec|ForkExec|StartProcess)$"
          msg: "禁止 syscall 级进程执行（G-12/NFR-9）：只能经 internal/tools/security 白名单入口"
        - pattern: "^os\\.StartProcess$"
          msg: "禁止 os.StartProcess（G-12/NFR-9）：只能经 internal/tools/security 白名单入口"
        - pattern: "^unix\\.(Exec|ForkExec)$"
          msg: "禁止 x/sys/unix 进程执行（G-12/NFR-9）：只能经 internal/tools/security 白名单入口"
        - pattern: "^(syscall|windows)\\.CreateProcess[AW]?$"
          msg: "禁止直接创建进程（G-12/NFR-9）：只能经 internal/tools/security 白名单入口"
        - pattern: "^time\\.(Now|Since|Until)$"
          msg: "[no-direct-clock] 禁止直接读取系统时钟（Story 1.4 AC5）：经注入的 internal/platform/clock.Clock 取时间（clock.Since/clock.Until 代替 time.Since/time.Until）；仅 internal/platform/clock 可调用"
  exclusions:
    generated: lax
    rules:
      # 唯一白名单入口：internal/tools/security（其内部仍受 `gates shell` 的参数数组/无 shell 检查约束）。
      - path: "^internal/tools/security/"
        linters:
          - forbidigo
      # 仓库开发期脚本与测试代码不进入任何发行产物；其 shell 用法仍由 `gates shell` 检查。
      - path: "^scripts/"
        linters:
          - forbidigo
      - path: "_test\\.go$"
        linters:
          - forbidigo
      - path: "^tests/"
        linters:
          - forbidigo
      # 直接读时钟的禁令（[no-direct-clock]）只约束 Server 业务代码 internal/<Server 模块>/，其余路径整体豁免；时钟包自身是唯一出口。
      - path-except: "^internal/(platform|auth|tenant|plugin|website|origin|cache|ruleengine|certificate|waf|security|l4proxy|dns|billing|cms|seo|media|monitoring|notification|node|cluster|scheduler|reporter)/"
        linters:
          - forbidigo
        text: "\\[no-direct-clock\\]"
      - path: "^internal/platform/clock/"
        linters:
          - forbidigo
        text: "\\[no-direct-clock\\]"
