# lingedge-site: component=docs host=docs.example.com
# 由 `lingedge install docs` 生成（tools-design §11.3）；只生成到本文件，不写入任何既有 Nginx 配置。
# 使用：在 http{} 内 include 本文件（原生 Nginx：安装时可选自动创建 /etc/nginx/conf.d/lingedge-docs.conf 软链并 nginx -t && reload）；
#       宝塔：面板里新建站点（域名 docs.example.com），include 本文件，或把站点 root 指向 /opt/lingedge/docs/current/public。
# 本文件由 Tools 管理：已存在且内容不同时安装不会覆盖，新内容写入 .new 供人工比对。

server {
    listen 80;
    listen [::]:80;
    server_name docs.example.com;
    server_tokens off;

    root /opt/lingedge/docs/current/public;
    index index.html;
    # 预压缩资源（发行包内随附 .gz）：需要 ngx_http_gzip_static_module（各发行版官方包均带；缺失时 nginx -t 会明确报错）。
    gzip_static on;
    gzip_vary on;

    location ^~ /api/ {
        return 404;
    }

    # 点文件不对外（/.well-known/ 除外）。
    location ~ /\.(?!well-known/) {
        return 404;
    }

    location / {
        include /etc/lingedge/nginx/docs-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html $uri.html =404;
    }
}
