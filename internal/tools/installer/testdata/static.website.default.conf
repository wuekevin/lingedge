# lingedge-site: component=website host=www.example.com
# 由 `lingedge install website` 生成（tools-design §11.3）；只生成到本文件，不写入任何既有 Nginx 配置。
# 使用：在 http{} 内 include 本文件（原生 Nginx：安装时可选自动创建 /etc/nginx/conf.d/lingedge-website.conf 软链并 nginx -t && reload）；
#       宝塔：面板里新建站点（域名 www.example.com），include 本文件，或把站点 root 指向 /opt/lingedge/website/current/public。
# 本文件由 Tools 管理：已存在且内容不同时安装不会覆盖，新内容写入 .new 供人工比对。

server {
    listen 80;
    listen [::]:80;
    server_name www.example.com;
    server_tokens off;

    root /opt/lingedge/website/current/public;
    index index.html;
    # 预压缩资源（发行包内随附 .gz）：需要 ngx_http_gzip_static_module（各发行版官方包均带；缺失时 nginx -t 会明确报错）。
    gzip_static on;
    gzip_vary on;

    # 官网公网域只放行 /api/v1/public/（其下的 setup 向导接口显式 404），其余 /api/ 一律 404：Admin/Console/认证接口在官网域不可达。

    location = /api/v1/public/setup {
        return 404;
    }

    location ^~ /api/v1/public/setup/ {
        return 404;
    }

    location ^~ /api/v1/public/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ^~ /api/ {
        return 404;
    }

    # 点文件不对外（/.well-known/ 除外）。
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # 内容哈希命名的构建产物：永久缓存。
    location ^~ /_nuxt/ {
        include /etc/lingedge/nginx/website-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        include /etc/lingedge/nginx/website-security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/index.html $uri.html =404;
    }
}
