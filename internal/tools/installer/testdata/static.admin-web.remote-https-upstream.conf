# lingedge-site: component=admin-web host=admin.example.com
# 由 `lingedge install admin-web` 生成（tools-design §11.3）；只生成到本文件，不写入任何既有 Nginx 配置。
# 使用：在 http{} 内 include 本文件（原生 Nginx：安装时可选自动创建 /etc/nginx/conf.d/lingedge-admin-web.conf 软链并 nginx -t && reload）；
#       宝塔：面板里新建站点（域名 admin.example.com），include 本文件，或把站点 root 指向 /opt/lingedge/admin-web/current/public。
# 本文件由 Tools 管理：已存在且内容不同时安装不会覆盖，新内容写入 .new 供人工比对。

server {
    listen 80;
    server_name admin.example.com;
    server_tokens off;

    root /opt/lingedge/admin-web/current/public;
    index index.html;
    # 预压缩资源（发行包内随附 .gz）：需要 ngx_http_gzip_static_module（各发行版官方包均带；缺失时 nginx -t 会明确报错）。
    gzip_static on;
    gzip_vary on;

    location ^~ /api/ {
        proxy_pass https://server.example.com:8443;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/lingedge/ca.pem;
        proxy_read_timeout 60s;
    }

    # 点文件不对外（/.well-known/ 除外）。
    location ~ /\.(?!well-known/) {
        return 404;
    }

    # 内容哈希命名的构建产物：永久缓存。
    location ^~ /assets/ {
        include /etc/lingedge/nginx/admin-web-security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # 入口页不缓存：发新版本后浏览器立即拿到新的哈希资源名。
    location = /index.html {
        include /etc/lingedge/nginx/admin-web-security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # SPA 历史路由：未命中静态文件回落入口页（/api/ 已在上面单独处理，不会落到这里）。
    location / {
        include /etc/lingedge/nginx/admin-web-security-headers.conf;
        add_header Cache-Control "no-store" always;
        try_files $uri /index.html;
    }
}
