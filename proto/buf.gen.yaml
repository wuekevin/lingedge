# Story 1.3：Go 代码生成（make proto → dist/proto-gen/，已 gitignore）。插件一律 `go run <pkg>@<固定版本>`，
# protoc-gen-go 的版本同时决定 protobuf 运行时版本（scripts/proto-check-gen.sh 据此解析）。
# 生成物暂不入库：make proto-check 生成两次比对（可再现）并在临时 module 真实编译，原因见该脚本头注释。
version: v2
managed:
  enabled: false
plugins:
  - local: ["go", "run", "google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12"]
    out: .
    opt:
      - module=github.com/wuekevin/lingedge/proto
  - local: ["go", "run", "google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.2"]
    out: .
    opt:
      - module=github.com/wuekevin/lingedge/proto
      - require_unimplemented_servers=true
