// LingEdge Node 协议 · 控制（心跳、证书续期）
// 监听：Server :9443（mTLS，严格要求客户端证书）
// 阶段：M1
syntax = "proto3";

package lingedge.node.v1;

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";
import "lingedge/node/v1/common.proto";

option go_package = "github.com/wuekevin/lingedge/proto/lingedge/node/v1;nodev1";

// NodeControlService 节点控制面主通道。节点主动发起；Server 不向节点推送任何文件或命令。
// 认证主体：mTLS 证书 role=ROLE_NODE（Heartbeat 在 P3 同样供 ROLE_DNS/ROLE_REPORTER 使用，届时另行扩展）。
service NodeControlService {
  // Heartbeat 周期心跳：上报状态与实际生效配置；返回期望配置、站点 epoch 增量、任务提示与指令。
  // 阶段：M1。
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);

  // RenewCertificate 在证书剩余有效期 ≤ 1/3 时（约第 60 天）用当前有效证书续期（ADR-003）。
  // 两阶段：新证书签发为 pending（旧证书保持 active）；新证书**首次成功 mTLS 握手**后 Server 才将其置 active、
  // 旧证书置 superseded（宽限 min(旧 not_after, 7 天)），响应丢失或落盘前崩溃时旧证书仍可用。
  // 证书已过期则本接口拒绝（UNAUTHENTICATED），须重新 enroll（`lingedge node enroll --force-reenroll`）。
  // 阶段：M1。
  rpc RenewCertificate(RenewCertificateRequest) returns (RenewCertificateResponse);

  // GetCaBundle 获取私有 CA 根证书 bundle（CA 轮换 S1，ADR-003 §CA 轮换）。
  // 收到 DIRECTIVE_REFETCH_CA_BUNDLE 或 latest_ca_bundle_version 大于本地时调用。
  // 阶段：M1（v1 新增 RPC，向后兼容）。
  rpc GetCaBundle(GetCaBundleRequest) returns (GetCaBundleResponse);
}

// ApplyState 节点侧配置应用状态机（与 deployment_targets 对应；NOTIFIED 为 Server 侧状态，节点不上报）。
enum ApplyState {
  APPLY_STATE_UNSPECIFIED = 0;
  APPLY_STATE_PENDING = 1;      // 已知晓 desired，尚未开始
  APPLY_STATE_DOWNLOADED = 2;   // 修订已完整下载
  APPLY_STATE_VERIFIED = 3;     // sha256 + 签名 + seq 单调 校验通过
  APPLY_STATE_TESTED = 4;       // 渲染完成且 `openresty -t` 通过
  APPLY_STATE_APPLIED = 5;      // 已切换 current 并 reload
  APPLY_STATE_HEALTHY = 6;      // 健康检查通过，确认生效
  APPLY_STATE_FAILED = 7;       // 任一步失败（节点已保持/恢复上一有效代）
  APPLY_STATE_ROLLED_BACK = 8;  // 应用后健康检查失败，已回退上一代
}

// AppliedState 节点对某集群"实际生效"的配置（权威记录写入 node_cluster_state）。
message AppliedState {
  string cluster_uid = 1;
  uint64 applied_seq = 2;            // 当前正在服务的修订序号；0=尚无
  string applied_revision_uid = 3;
  ApplyState state = 4;              // 该集群最近一次应用尝试的状态
  uint64 last_attempt_seq = 5;       // 最近一次尝试的 seq（可能大于 applied_seq，表示失败）
  string last_error_code = 6;        // 失败时的稳定错误码，成功为空
  Digest config_hash = 7;            // 当前生效产物（渲染后配置+数据）的哈希，用于健康检查回显核对
  google.protobuf.Timestamp applied_at = 8;
  // ---- 以下为 v1 新增字段（向后兼容）----
  // 节点已应用修订的 lineage（与 applied_seq 一起构成 (lineage, seq) 比较键，ADR-002 §12）。
  uint64 applied_lineage = 9;
  // 节点代编号 g<N> 的 N（node generation，ADR-020 §2）：一个节点代 = {cluster_uid → (lineage, seq)} 集合，
  // 单一渲染目录、单一 current。多集群时所有集群的 AppliedState 携带同一个 node_generation。
  uint64 node_generation = 10;
  // 节点级回滚后对该集群设置的 held_seq（= 被回退掉的 seq）；0=无。Server 对 desired.seq ≤ held_seq 返回 ACTION_HOLD，
  // 平台发布更高 seq 的修订时自动解除（decisions D-PUB-6）。
  uint64 held_seq = 11;
}

// NodeStatus 节点资源与进程状态。
message NodeStatus {
  double cpu_percent = 1;            // 资源占用比例为展示用近似值，非计费数据（计费一律整数，见 telemetry）
  uint64 memory_used_bytes = 2;
  uint64 memory_total_bytes = 3;
  uint64 disk_used_bytes = 4;        // 数据盘（缓存/日志所在）
  uint64 disk_total_bytes = 5;
  uint64 cache_disk_used_bytes = 6;
  uint64 cache_disk_limit_bytes = 7;
  uint64 active_connections = 8;
  // 与 DB/OpenAPI `nodes.openresty_state ∈ running|stopped|failed|unknown` 的映射（node-protocol §5）：
  //  RUNNING→running；RELOADING→running（瞬时）；STOPPED→stopped；CONFIG_ERROR→failed；UNSPECIFIED→unknown。
  enum OpenRestyState {
    OPENRESTY_STATE_UNSPECIFIED = 0;
    OPENRESTY_STATE_RUNNING = 1;
    OPENRESTY_STATE_STOPPED = 2;
    OPENRESTY_STATE_RELOADING = 3;
    OPENRESTY_STATE_CONFIG_ERROR = 4;
  }
  OpenRestyState openresty_state = 9;
  uint64 openresty_restart_count = 10;  // 自 Agent 启动以来
  bool maintenance_mode = 11;           // 节点本地是否已进入维护（由 ENTER_MAINTENANCE 指令触发）
  uint64 log_spool_bytes = 12;          // 待上传日志积压字节
  google.protobuf.Timestamp boot_time = 13;
  string boot_id = 14;                  // 每次 Agent 进程启动生成的随机 ID，用于发现重启
}

message HeartbeatRequest {
  string node_uid = 1;                  // 冗余自检：必须等于证书主体
  ClientInfo client = 2;
  uint64 heartbeat_seq = 3;             // 本 boot_id 内单调递增，用于排序与丢包观测（非防重放依据）
  NodeStatus status = 4;
  repeated AppliedState applied = 5;    // 节点所属每个集群各一项
  uint64 keyset_version = 6;            // 本地签名 keyset 版本
  // 站点 epoch 增量游标：上次 HeartbeatResponse.next_site_epoch_cursor；首次/本地状态丢失为 0。
  uint64 site_epoch_cursor = 7;
  google.protobuf.Timestamp certificate_not_after = 8;  // 供 Server 提前告警（F-2）
  // v1 新增：本地已持有的 CA bundle 版本；Server 在 nodes.ca_bundle_version 记录，用于 CA 轮换 S2 门禁。
  uint64 ca_bundle_version = 9;
}

// DesiredState Server 希望节点在某集群上达到的状态。
// 灰度机制：只有被当前批次选中的节点才会在其 HeartbeatResponse 中看到新的 desired（ADR-002）。
message DesiredState {
  string cluster_uid = 1;
  RevisionRef revision = 2;
  uint64 size_bytes = 3;                // bundle 总大小，供下载进度与磁盘预检
  string deployment_uid = 4;            // 关联部署，ReportApply 回传
  string deployment_target_uid = 5;     // 关联部署目标（节点×部署）；= deployment_targets.uid
  enum Action {
    ACTION_UNSPECIFIED = 0;
    ACTION_APPLY = 1;                   // 应用该修订（含"回滚"——回滚也是新修订，seq 仍递增）
    // 保持当前代，不应用：灰度暂停/批次未轮到，或节点级回滚后 desired.seq ≤ held_seq（见 AppliedState.held_seq）。
    // 离线节点上线后其 desired = 集群 confirmed_revision（追平），应用成功后 Server 回写 waiting_offline 目标为 healthy。
    ACTION_HOLD = 2;
  }
  Action action = 6;
}

// SiteEpoch 整站逻辑失效的 epoch（ADR-007）。Agent 取 max(本地, 下发)并持久化。
message SiteEpoch {
  string site_uid = 1;
  uint64 epoch = 2;
  // 比较键为 (lineage, epoch)，Agent 取 max；数据库恢复后 lineage 提升可使 epoch 重新起算而不被旧值吞掉（ADR-002 §12）。
  uint64 lineage = 3;
}

// Directive 白名单指令（枚举，**无任何自由文本命令**）。
enum Directive {
  DIRECTIVE_UNSPECIFIED = 0;
  DIRECTIVE_REFETCH_KEYSET = 1;     // 立即 GetSigningKeyset
  DIRECTIVE_RENEW_CERT = 2;         // 立即续期证书
  DIRECTIVE_ENTER_MAINTENANCE = 3;  // 进入维护（节点继续服务现有连接，调度层面摘出；P3 起影响调度）
  DIRECTIVE_EXIT_MAINTENANCE = 4;
  DIRECTIVE_UPLOAD_LOGS_NOW = 5;    // 立即上传日志/rollup（用于排障）
  DIRECTIVE_REPORT_FULL_STATE = 6;  // 下一次心跳上报完整状态并重置 epoch 游标
  DIRECTIVE_REFETCH_CA_BUNDLE = 7;  // 立即 GetCaBundle（CA 轮换 S1，v1 新增）
}

message HeartbeatResponse {
  google.protobuf.Timestamp server_time = 1;        // 用于检测时钟偏差；Agent 偏差过大应上报事件
  google.protobuf.Duration next_interval = 2;       // 下一次心跳间隔（Server 可退避/加速）；默认值待基线测试后确定
  repeated DesiredState desired = 3;                // 每个所属集群一项
  repeated SiteEpoch site_epochs = 4;               // 自 site_epoch_cursor 之后的增量
  uint64 next_site_epoch_cursor = 5;
  bool site_epoch_full_resync = 6;                  // true 表示 site_epochs 为全量快照（游标失效/首次）
  uint32 pending_task_count = 7;                    // >0 则 Agent 应立即 PullTasks
  uint64 latest_keyset_version = 8;                 // 大于本地 keyset_version 时 Agent 应 GetSigningKeyset
  repeated Directive directives = 9;
  string min_agent_version = 10;                    // 低于此版本时 Agent 应上报告警事件（不强制停服）
  uint32 protocol_major = 11;                       // Server 实现的协议主版本
  uint64 latest_ca_bundle_version = 12;             // 大于本地 ca_bundle_version 时 Agent 应 GetCaBundle（v1 新增）
}

message RenewCertificateRequest {
  string node_uid = 1;
  bytes csr_pem = 2;  // 新私钥对应的 CSR（建议每次续期换新密钥）；服务端同样只采用公钥
}

message RenewCertificateResponse {
  // 新证书（pending，首次成功握手后生效）。
  bytes certificate_chain_pem = 1;
  bytes ca_bundle_pem = 2;
  google.protobuf.Timestamp certificate_not_after = 3;
}

// GetCaBundleRequest / Response：CA 根证书 bundle 获取（CA 轮换，ADR-003）。
// bundle 可同时含新旧两张根；Server 叶证书改由新 CA 签发（S3）之前，Server 会等待所有证书未过期的节点上报
// ca_bundle_version ≥ 新版本（S2 门禁）。
message GetCaBundleRequest {
  uint64 known_version = 1;
}

message GetCaBundleResponse {
  bool not_modified = 1;
  uint64 version = 2;
  bytes ca_bundle_pem = 3;
}
