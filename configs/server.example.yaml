# lingedge-server 示例配置（Story 1.4）。复制为 /etc/lingedge/server/server.yaml（开发时可复制为 configs/server.local.yaml，
# 该文件名已被 .gitignore 忽略）后按需修改。
#
# 本文件不含任何口令或密钥（NFR-6）：
#   - 数据库/Redis 口令只能通过以下两种方式之一提供，二者不可同时设置：
#       1) 环境变量  LINGEDGE_DATABASE__PASSWORD / LINGEDGE_REDIS__PASSWORD
#       2) 配置键    database.password_file / redis.password_file，指向只含口令的文件
#          （绝对路径；权限不得允许「其他用户」访问，例如 root:lingedge 0440；文件末尾换行会被忽略）
#   - 主密钥 master.key 不在此文件中，由 Tools 安装步骤生成并经 systemd LoadCredential 提供（ADR-011）。
# 任何键都可用环境变量覆盖：LINGEDGE_<节>__<键>（双下划线分隔层级，全大写），例如 LINGEDGE_HTTP__LISTEN。
# 配置中出现未知键、重复键、类型不符会被拒绝，错误信息只含键路径、不回显取值。

server:
  # 环境名，进入 Redis 键空间 le:<env>:…，运行期必填（共用同一 Redis 的多套环境必须不同；
  # 本地开发请改为 dev，避免与生产键空间 le:prod:… 混用）。
  env: prod
  # 数据目录。
  data_dir: /var/lib/lingedge/server

http:
  # REST 监听；默认仅本机，由 Nginx 反代。
  listen: 127.0.0.1:8080

grpc:
  # 节点 mTLS gRPC。
  listen: 0.0.0.0:9443
  # 节点注册端口（仅有未过期注册令牌时才会真正监听）。
  enroll_listen: 0.0.0.0:9444

metrics:
  # Prometheus 指标，仅本机。
  listen: 127.0.0.1:9180

database:
  host: 127.0.0.1
  port: 3306
  name: lingedge
  user: lingedge_app
  # 口令：见文件头说明（password_file 或 LINGEDGE_DATABASE__PASSWORD）。
  # 维护账号（可选，Story 1.15）：Scheduler 的 partition.maintain 用它对分区表做 REORGANIZE PARTITION（滚动预建未来分区，database/README §5.1）。
  # 不配置则该作业明确跳过并持续告警（audit_logs 等将写入 pmax 兜底分区，不影响写入但分区不再滚动）。
  # 口令同样只能经环境变量 LINGEDGE_DATABASE__MAINT__PASSWORD 或 maint 下的口令文件键提供（见文件头说明）。
  # maint:
  #   user: lingedge_maint

redis:
  addr: 127.0.0.1:6379
  db: 0
  # 口令（如有）：见文件头说明（password_file 或 LINGEDGE_REDIS__PASSWORD）。
  # Redis 仅作缓存/限流/唤醒，非唯一真相源；不可达时 Server 以降级模式运行（ADR-025）。
  # 跨主机/不可信网络请启用 TLS（证书校验不可关闭）：
  # tls: true
  # tls_ca_file: /etc/lingedge/redis-ca.pem
  # tls_server_name: redis.internal

log:
  # debug | info | warn | error
  level: info
  # json | console（生产与日志采集使用 json）
  format: json

auth:
  # 口令哈希 argon2id 参数（Story 1.16、ADR-018 §4）。缺省值来自开发机（Apple M2 / 8 核）基准：m=64MiB、t=4、p=4 ≈ 47 ms/次；
  # **生产机必须按其 CPU/内存复测后调整**（方法：go test -run '^$' -bench Argon2idHash -benchtime 20x ./internal/auth/internal/service/，
  # 可用 LE_ARGON2_M/T/P 环境变量试不同组合；目标单次约 50–250 ms；并发峰值内存 ≈ 并发登录数 × m）。
  # 下限（OWASP 最低建议）m>=19456 KiB、t>=2、p>=1，低于下限拒绝启动。改参数后，用户下次登录成功时其哈希会自动升级。
  # 会话滑动/绝对过期、登录节流窗口与阈值是系统设置（system_settings 的 auth.* / login.* 键，UD-27），不在此处。
  argon2:
    memory_kib: 65536
    iterations: 4
    parallelism: 4

secrets:
  # 主密钥文件（ADR-011）。留空 = 读取 $CREDENTIALS_DIRECTORY/master.key（systemd LoadCredential）。
  # 文件须 0400/0440 且属主为 root 或运行用户，否则拒绝启动；内容不在本文件、不入库、不入日志。
  # master_key_file: /etc/lingedge/server/master.key

# release:
#   # 官方发行源地址（未定，UD-3），必须是 https，不得内嵌凭据。
#   base_url: https://releases.example.org/
#   # 追加的根证书文件（绝对路径，可选）。
#   ca_file: /etc/lingedge/release-ca.pem
