# 合并门禁（Story 1.2；Story 1.3 增契约工具链；Story 1.36 增前端 workspace 门禁）：违规代码无法合并。本地等价命令：make verify-gates && make test && make race（前端检查已并入 lint/test/gate-selftest/contract-check/verify-build，也可单独 make frontend-check）。
# 注意：本工作流尚未在远端 CI 实际运行过（仓库尚无提交/远端），首次运行结果以实际为准。
name: ci

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

jobs:
  gates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # 契约破坏性检测需要 contract-v1 标签与历史（Story 1.3）
          fetch-tags: true
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.4"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26.8.2" # 与本机验证的 Node 一致（frontend/README.md 兼容矩阵）
      - name: 安装 pnpm（精确版本，必须与 frontend/package.json 的 packageManager 一致）
        run: npm install --global pnpm@12.18.0
      - name: 构建（含交叉编译矩阵；verify-build 含前端生产构建 + Console 隔离 + mock 检查）
        run: make build verify-build
      - name: 静态门禁（lint：依赖方向 / 禁 exec 拼接 / 前端依赖锁定·架构门禁·令牌对比度·i18n·vue-tsc；security：口令 / 测试替身 / 品牌）
        run: make lint security
      - name: 门禁自测（正向通过 + 负向必败；含前端门禁脚本自测）
        run: make gate-selftest
      - name: 契约工具链（OpenAPI/proto/迁移破坏性检测与冻结复核 + 前端 OpenAPI 类型漂移；需已推送 contract-v1 标签）
        run: make contract-check
      - name: 单元测试（含前端 vitest）与竞态
        run: make test race
